services:
  postgres:
    image: postgres:17

    container_name: indie-now-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: indienow
      POSTGRES_PASSWORD: indie2026
      POSTGRES_DB: indiedb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: